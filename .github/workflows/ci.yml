name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  LIVE_URL: https://tally.nhatt.workers.dev

jobs:
  check:
    name: Types, lint, unit tests, build and size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm test:relay
      - run: pnpm build
      - run: pnpm size

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:e2e
      # Also when a retry passed: the report keeps a flaky test's failed
      # attempt, with its trace.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14

  deploy:
    name: Deploy to Cloudflare
    needs: [check, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.LIVE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
      - name: Smoke test the live site
        run: |
          # Passes once the live page serves this build's script and the Worker
          # answers. A first deploy can take a minute or two to start routing.
          script=$(grep -o '/assets/index-[^"]*\.js' dist/client/index.html | head -1)
          for attempt in $(seq 1 30); do
            if curl -fsS "$LIVE_URL/" | grep -qF "$script" &&
              curl -fsS "$LIVE_URL/api/health" | grep -q '"ok":true'; then
              echo "Live at $LIVE_URL, serving $script"
              exit 0
            fi
            echo "Not live yet (attempt $attempt of 30); retrying in 5 s"
            sleep 5
          done
          echo "::error::$LIVE_URL did not serve this build within 150 s"
          exit 1
      - name: Smoke test the relay
        # Without creating any data: see scripts/smoke-relay.mjs.
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/smoke-relay.mjs "$LIVE_URL" && exit 0
            echo "Relay not answering yet (attempt $attempt of 6); retrying in 10 s"
            sleep 10
          done
          echo "::error::The relay at $LIVE_URL did not answer"
          exit 1
